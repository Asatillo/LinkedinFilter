<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>LinkedIn Job Filter</title>
  </head>
  <body>
    <div class="header">
      <img src="assets/icon16.png" alt="LinkedIn Job Filter" class="logo-icon">
      <div class="title">LinkedIn Job Filter</div>
      <div class="master-switch" title="Master switch for all filtering">
        <span class="switch-state" id="switchState">ON</span>
        <div class="toggle" id="extensionEnabled"></div>
      </div>
    </div>

    <div class="section-caption">Hide jobs marked as</div>
    <div class="filter-chips">
      <button type="button" class="chip" id="hideApplied">Applied</button>
      <button type="button" class="chip" id="hideViewed">Viewed</button>
      <button type="button" class="chip" id="hidePromoted">Promoted</button>
    </div>

    <div class="list-section">
      <div class="section-header">
        <span class="section-title">Company Blacklist</span>
        <div
          class="toggle small"
          id="hideCompanies"
          title="Hide jobs from blacklisted companies"
        ></div>
      </div>
      <input
        type="text"
        id="companyInput"
        class="list-input"
        placeholder="Type a company, press Enter"
        maxlength="100"
      />
      <div id="companiesList" class="chip-list"></div>
    </div>

    <div class="list-section">
      <div class="section-header">
        <span class="section-title">Title Keywords</span>
        <div
          class="toggle small"
          id="hideKeywords"
          title="Hide jobs whose title contains a keyword"
        ></div>
      </div>
      <input
        type="text"
        id="keywordInput"
        class="list-input"
        placeholder="Type a keyword, press Enter"
        maxlength="100"
      />
      <div id="keywordsList" class="chip-list"></div>
    </div>

    <div class="status" id="status">Extension ready</div>

    <div class="footer">
      <div class="footer-text">
        Built with <span class="heart">❤️</span> by
        <a href="https://github.com/Asatillo" target="_blank" class="author-link">Asat</a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
